name: Fix hide stored Alle person

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exclude stored Alle person from person-only views
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'const realPeopleEntries=()=>Object.entries(state.people||{}).filter(([id])=>id!=="all");'
          new = 'const realPeopleEntries=()=>Object.entries(state.people||{}).filter(([id,p])=>id!=="all"&&String(p?.name||"").trim().toLowerCase()!=="alle");'
          if old not in s:
              raise SystemExit('Zielzeile nicht gefunden')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/fix-hide-alle.yml
          git add index.html
          git commit -m "Grauen Alle-Eintrag aus Dashboard Belohnungen und Einstellungen entfernen"
          git push
