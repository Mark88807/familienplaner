name: Dashboard Essenwunsch button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace dashboard Essenplan button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="week-meal-toolbar"><button class="week-meal-plan-link" type="button" data-view="meals">Essenplan</button></div>'
          new = '<div class="week-meal-toolbar"><button class="week-meal-plan-link" type="button" onclick="openModal(\'mealWishModal\')">Essenwunsch</button></div>'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one dashboard Essenplan button, found {count}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/dashboard-essenwunsch.yml
          git add index.html
          git commit -m "Dashboard: Essenwunsch statt Essenplan"
          git push
