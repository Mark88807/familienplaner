name: Familienplaner und persönliche Kalender veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  patch-source:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Gewünschte UI-Anpassungen anwenden
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          button = '<button class="ghost" id="calendarTodayBtn">Heute</button>'
          if button not in s:
              raise SystemExit('Heute-Button nicht gefunden')
          s = s.replace(button, '', 1)

          old_handler = '$("calendarTodayBtn").onclick=()=>{calendarCursor=new Date();renderCalendarPeriodTitle();renderCalendar()};'
          if old_handler not in s:
              raise SystemExit('Heute-Handler nicht gefunden')
          s = s.replace(old_handler, '', 1)

          old_dash = '<div class="dashboard-events-section"><div class="dashboard-section-label">Termine</div>${groupRows(eventItems,"Keine Termine diese Woche.")}</div>'
          new_dash = '<div class="dashboard-events-section">${groupRows(eventItems,"Keine Termine diese Woche.")}</div>'
          if old_dash not in s:
              raise SystemExit('Doppelte Termine-Zeile nicht gefunden')
          s = s.replace(old_dash, new_dash, 1)

          pattern = r'  function renderCalendarPeriodTitle\(\)\{.*?\}\n  function setCalendarMode'
          replacement = '''  function isoWeekNumber(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-yearStart)/86400000)+1)/7)}
  function renderCalendarPeriodTitle(){if(!$("calendarPeriodTitle"))return;const c=new Date(calendarCursor);if(calendarMode==="week"){const day=(c.getDay()+6)%7,start=new Date(c),end=new Date(c);start.setDate(c.getDate()-day);end.setDate(start.getDate()+6);const week=isoWeekNumber(start),monthFmt=new Intl.DateTimeFormat("de-DE",{month:"long"}),startMonth=monthFmt.format(start),endMonth=monthFmt.format(end),monthLabel=startMonth===endMonth?`${startMonth} ${end.getFullYear()}`:`${startMonth}/${endMonth} ${end.getFullYear()}`;$("calendarPeriodTitle").textContent=`KW ${week} · ${monthLabel} · ${new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit"}).format(start)} – ${new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}).format(end)}`}else if(calendarMode==="month")$("calendarPeriodTitle").textContent=new Intl.DateTimeFormat("de-DE",{month:"long",year:"numeric"}).format(c);else $("calendarPeriodTitle").textContent=String(c.getFullYear())}
  function setCalendarMode'''
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Kalender-Titel konnte nicht ersetzt werden: {count}')

          path.write_text(s, encoding='utf-8')
          PY

          grep -q 'function isoWeekNumber' index.html
          grep -q 'KW ${week}' index.html
          ! grep -q 'id="calendarTodayBtn"' index.html
          ! grep -q 'dashboard-section-label">Termine' index.html

          git show HEAD^:.github/workflows/pages.yml > .github/workflows/pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/pages.yml
          git commit -m "Update calendar labels and dashboard appointments"
          git push origin HEAD:main

  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.change.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Letzten Kalenderstand laden
        uses: actions/cache/restore@v4
        with:
          path: .calendar-state
          key: calendar-state-${{ github.run_id }}
          restore-keys: calendar-state-
      - name: Öffentliche App und private Feed-Pfade bauen
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_EXPORT_EMAIL: ${{ secrets.FIREBASE_EXPORT_EMAIL }}
          FIREBASE_EXPORT_PASSWORD: ${{ secrets.FIREBASE_EXPORT_PASSWORD }}
          FIREBASE_FAMILY_ID: ${{ secrets.FIREBASE_FAMILY_ID }}
          CALENDAR_FEEDS_JSON: ${{ secrets.CALENDAR_FEEDS_JSON }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp manifest.webmanifest familienplaner-icon.svg familienplaner-icon-180.png familienplaner-icon-192.png familienplaner-icon-512.png _site/
          node scripts/generate-calendars.mjs _site
      - name: Änderungen ermitteln
        id: change
        shell: bash
        run: |
          NEW_HASH="$(find _site -type f -name '*.ics' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          OLD_HASH="$(test -f .calendar-state/hash && cat .calendar-state/hash || true)"
          mkdir -p .calendar-state
          printf '%s' "$NEW_HASH" > .calendar-state/hash
          if [[ "${{ github.event_name }}" == "push" || "$NEW_HASH" != "$OLD_HASH" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Neuen Kalenderstand speichern
        uses: actions/cache/save@v4
        with:
          path: .calendar-state
          key: calendar-state-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.change.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.deploy == 'true'
    steps:
      - name: GitHub Pages Artifact veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4